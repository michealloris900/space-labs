<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="Bishop - DulsInspirations.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Tailwind CSS CDN dengan Preload -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              space: {
                black: '#0a0e17',
                blue: '#1a237e',
                purple: '#4a148c',
                'blue-light': '#3b82f6',
                'purple-light': '#8b5cf6',
              },
              gray: {
                850: '#1f2937',
                950: '#0f172a',
              }
            },
            fontFamily: {
              'sans': ['Inter', 'system-ui', 'sans-serif'],
              'mono': ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 3s ease-in-out infinite',
              'spin-slow': 'spin 20s linear infinite',
              'slide-in': 'slideIn 0.5s ease-out',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0) translateX(0)' },
                '50%': { transform: 'translateY(-20px) translateX(10px)' },
              },
              slideIn: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            },
            backgroundImage: {
              'space-gradient': 'linear-gradient(135deg, #0a0e17 0%, #1a237e 100%)',
              'galaxy': 'radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.1) 0%, rgba(26, 35, 126, 0.05) 50%, #0a0e17 100%)',
              'card-gradient': 'linear-gradient(145deg, rgba(26, 35, 126, 0.2) 0%, rgba(74, 20, 140, 0.1) 100%)',
            },
            boxShadow: {
              'space': '0 10px 40px rgba(59, 130, 246, 0.15)',
              'inner-space': 'inset 0 2px 10px rgba(255, 255, 255, 0.05)',
            }
          }
        }
      }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Base CSS untuk reset dan utilities custom -->
    <style>
      /* CSS Reset */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      html {
        scroll-behavior: smooth;
      }
      
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #0a0e17;
        color: #ffffff;
        overflow-x: hidden;
        min-height: 100vh;
        background-image: 
          radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
      }
      
      /* Custom Utility Classes */
      .text-gradient {
        background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .bg-glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .bg-glass-dark {
        background: rgba(10, 14, 23, 0.8);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(59, 130, 246, 0.2);
      }
      
      .hover-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      
      .hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(59, 130, 246, 0.2);
      }
      
      /* Star Field Effect */
      .star-field {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      }
      
      .star {
        position: absolute;
        background-color: white;
        border-radius: 50%;
        animation: twinkle var(--duration) infinite ease-in-out;
      }
      
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      
      ::-webkit-scrollbar-track {
        background: #0a0e17;
      }
      
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #3b82f6, #8b5cf6);
        border-radius: 5px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #60a5fa, #a78bfa);
      }
    </style>
    
    <title>Space Education Indonesia</title>
  </head>
  <body class="font-sans">
    <!-- Star Field Background -->
    <div class="star-field" id="starField"></div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Star Field Script -->
    <script>
      // Create star field
      document.addEventListener('DOMContentLoaded', function() {
        const starField = document.getElementById('starField');
        const starsCount = 150;
        
        for (let i = 0; i < starsCount; i++) {
          const star = document.createElement('div');
          const size = Math.random() * 3 + 1;
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          const duration = Math.random() * 5 + 3;
          
          star.className = 'star';
          star.style.width = `${size}px`;
          star.style.height = `${size}px`;
          star.style.left = `${x}%`;
          star.style.top = `${y}%`;
          star.style.setProperty('--duration', `${duration}s`);
          
          starField.appendChild(star);
        }
      });
    </script>
  </body>
</html>
