<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="Bishop - DulsInspirations.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Di public/index.html -->
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Space Education Indonesia - Platform edukasi antariksa" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Configuration -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              space: {
                black: '#0a0e17',
                blue: '#1a237e',
                purple: '#4a148c',
                dark: '#121212',
                light: '#1e293b',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-glow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 20s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            },
            backgroundImage: {
              'space-gradient': 'linear-gradient(135deg, #0a0e17 0%, #1a237e 100%)',
              'galaxy': 'radial-gradient(circle at 50% 50%, #1a237e 0%, #0a0e17 100%)',
            }
          }
        }
      }
    </script>
    
    <!-- Custom CSS -->
    <style>
      /* Custom utilities */
      .text-gradient {
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .bg-glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Star field effect */
      .star {
        position: absolute;
        background-color: white;
        border-radius: 50%;
        animation: twinkle var(--duration) infinite ease-in-out;
      }
      
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
    </style>
    
    <title>Space Education Indonesia</title>
  </head>
  <body class="bg-space-black text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
